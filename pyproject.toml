[project]
name = "servoc"
version = "0.1.0"
description = "Serve ASR and TTS models at blazing speed"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "fastapi>=0.124.4",
    "pydantic>=2.12.5",
    "unicorn>=2.1.4",
    "uvicorn>=0.38.0",
    "numpy>=2.2.6",
    "python-multipart>=0.0.21",
    "openai>=2.14.0",
    "intel-extension-for-pytorch==2.8.0",
    "setuptools>=80.9.0",
    "psutil>=7.1.3",
    "librosa==0.11.0"
]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchaudio = [
  { index = "pytorch-cpu" },
]
fairseq = { git = "https://github.com/facebookresearch/fairseq.git", rev = "v0.12.1" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.setuptools]
package-dir = {"" = "app"}

[dependency-groups]
springlab-wav2vec2 = [
    "fairseq",
    "transformers==4.50.3",
]
whisper = [
    "omegaconf>=2.3.0",
    "transformers==4.45.0",
]


[tool.uv]
conflicts = [
  [
    { group = "whisper" },
    { group = "springlab-wav2vec2" }
  ]
]
